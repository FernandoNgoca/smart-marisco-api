spring:
    config:
        import: optional:file:.env.local.properties

    application:
        name: smart-marisco-api

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://localhost:3306/sm_bd?serverTimezone=UTC}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:Supremo@2026!}

    jpa:
        hibernate:
            ddl-auto: validate
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

        show-sql: false
        open-in-view: false

    jackson:
        serialization:
            write-dates-as-timestamps: false

        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: Europe/Lisbon

server:
    servlet:
        context-path: /smart-marisco-api

logging:
    level:
        mz.com.sgp: DEBUG

cors:
    originPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

security:
    jwt:
        token:
            secret-key: ${JWT_SECRET}
            issuer: smart-marisco-api
            audience: smart-marisco-client
            expire-length: 900000
            refresh-length: 10800000
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
    api-docs:
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${API_DOCS_ENABLED:false}
