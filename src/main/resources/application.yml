spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Europe/Lisbon

server:
    port: ${PORT:8080}
    servlet:
        context-path: /smart-marisco-api

logging:
    level:
        mz.com.sgp: DEBUG

cors:
    originPatterns: ${CORS_ALLOWED_ORIGINS:https://smart-marisco-web.onrender.com}

security:
    jwt:
        token:
            secret-key: ${JWT_SECRET}
            issuer: smart-marisco-api
            audience: smart-marisco-client
            expire-length: 900000
            refresh-length: 10800000
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
    api-docs:
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${API_DOCS_ENABLED:false}
